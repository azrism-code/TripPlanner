name: Deploy to Firebase

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install app dependencies
        run: npm install

      - name: Install function dependencies
        run: npm --prefix functions install

      - name: Build application
        run: npm run build

      - name: Prepare Firebase credentials
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_TRIPPLANNER_94835 }}
        run: |
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-service-account.json"

      - name: Check Trip AI secret
        id: ai_secret
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -n "$OPENAI_API_KEY" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            printf '%s' "$OPENAI_API_KEY" > "$RUNNER_TEMP/openai-api-key.txt"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::OPENAI_API_KEY GitHub Secret is not configured. Trip AI functions will not be deployed."
          fi

      - name: Deploy Firebase Hosting
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
        run: npx --yes firebase-tools@latest deploy --only hosting --project tripplanner-94835 --non-interactive

      - name: Deploy Firestore Rules
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs'
          import crypto from 'node:crypto'

          const projectId = 'tripplanner-94835'
          const credentials = JSON.parse(fs.readFileSync(process.env.GOOGLE_APPLICATION_CREDENTIALS, 'utf8'))
          const source = fs.readFileSync('firestore.rules', 'utf8')
          const base64url = (value) => Buffer.from(value).toString('base64url')
          const now = Math.floor(Date.now() / 1000)
          const header = base64url(JSON.stringify({ alg: 'RS256', typ: 'JWT' }))
          const payload = base64url(JSON.stringify({
            iss: credentials.client_email,
            scope: 'https://www.googleapis.com/auth/cloud-platform',
            aud: 'https://oauth2.googleapis.com/token',
            iat: now,
            exp: now + 3600
          }))
          const unsignedJwt = `${header}.${payload}`
          const signature = crypto.sign('RSA-SHA256', Buffer.from(unsignedJwt), credentials.private_key).toString('base64url')
          const assertion = `${unsignedJwt}.${signature}`
          const tokenResponse = await fetch('https://oauth2.googleapis.com/token', {
            method: 'POST',
            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
            body: new URLSearchParams({ grant_type: 'urn:ietf:params:oauth:grant-type:jwt-bearer', assertion })
          })
          const tokenBody = await tokenResponse.json()
          if (!tokenResponse.ok || !tokenBody.access_token) throw new Error(`Could not obtain Google access token: ${JSON.stringify(tokenBody)}`)
          const headers = { Authorization: `Bearer ${tokenBody.access_token}`, 'Content-Type': 'application/json' }
          const rulesetResponse = await fetch(`https://firebaserules.googleapis.com/v1/projects/${projectId}/rulesets`, {
            method: 'POST',
            headers,
            body: JSON.stringify({ source: { files: [{ name: 'firestore.rules', content: source, fingerprint: crypto.createHash('sha256').update(source).digest('base64') }] } })
          })
          const ruleset = await rulesetResponse.json()
          if (!rulesetResponse.ok) throw new Error(`Could not create Firestore ruleset: ${JSON.stringify(ruleset)}`)
          const releaseName = `projects/${projectId}/releases/cloud.firestore`
          const patchResponse = await fetch(`https://firebaserules.googleapis.com/v1/${releaseName}`, {
            method: 'PATCH', headers, body: JSON.stringify({ release: { name: releaseName, rulesetName: ruleset.name }, updateMask: 'rulesetName' })
          })
          if (patchResponse.status === 404) {
            const createResponse = await fetch(`https://firebaserules.googleapis.com/v1/projects/${projectId}/releases`, {
              method: 'POST', headers, body: JSON.stringify({ name: releaseName, rulesetName: ruleset.name })
            })
            const created = await createResponse.json()
            if (!createResponse.ok) throw new Error(`Could not create Firestore rules release: ${JSON.stringify(created)}`)
          } else {
            const patched = await patchResponse.json()
            if (!patchResponse.ok) throw new Error(`Could not update Firestore rules release: ${JSON.stringify(patched)}`)
          }
          NODE

      - name: Deploy Storage Rules
        continue-on-error: true
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
        run: node scripts/deploy-storage-rules.mjs

      - name: Sync OpenAI key to Firebase Secret Manager
        if: steps.ai_secret.outputs.available == 'true'
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
        run: npx --yes firebase-tools@latest functions:secrets:set OPENAI_API_KEY --data-file "$RUNNER_TEMP/openai-api-key.txt" --project tripplanner-94835 --non-interactive

      - name: Deploy Cloud Functions
        if: steps.ai_secret.outputs.available == 'true'
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
        run: npx --yes firebase-tools@latest deploy --only functions --project tripplanner-94835 --non-interactive --force
